stages:
  - check
  - coverage
  - pkgdown

variables:
  R_LIBS_USER: "$CI_PROJECT_DIR/ci/lib"

# Cache R packages between jobs
cache:
  key: ${CI_JOB_NAME}
  paths:
    - $CI_PROJECT_DIR/ci/lib

check-release:
  stage: check
  image: rocker/r-ver:4.6.0
  before_script:
    - apt-get update && apt-get install -y
        libcurl4-openssl-dev
        libssl-dev
        libxml2-dev
        libuv1-dev
        pandoc
        qpdf
    - mkdir -p $R_LIBS_USER
    # Install package dependencies including vignette builders
    - Rscript -e "install.packages(c('curl', 'remotes', 'rcmdcheck'), repos='https://cloud.r-project.org')"
    - Rscript -e "remotes::install_deps(dependencies = TRUE)"
  script:
    - Rscript -e "rcmdcheck::rcmdcheck(args = c('--no-manual', '--as-cran'), error_on = 'error')"

check-devel:
  stage: check
  image: rocker/r-devel:latest
  before_script:
    - apt-get update && apt-get install -y
        libcurl4-openssl-dev
        libssl-dev
        libxml2-dev
        libuv1-dev
        pandoc
        qpdf
    - mkdir -p $R_LIBS_USER
    - Rscript -e "install.packages(c('curl', 'remotes', 'rcmdcheck'), repos='https://cloud.r-project.org')"
    - Rscript -e "remotes::install_deps(dependencies = TRUE)"
  script:
    - Rscript -e "rcmdcheck::rcmdcheck(args = c('--no-manual', '--as-cran'), error_on = 'error')"
  allow_failure: true

# Tier 1: instrument only the package's own C code. Needs no sanitizer build
# of R, so it runs in the ordinary rocker image. Catches package-level UB,
# which is the class of defect CRAN's gcc-SAN reported on 0.9.0.
.sanitizer-base: &sanitizer-base
  stage: check
  image: rocker/r-ver:4.6.0
  variables:
    NOT_CRAN: "true"
  before_script:
    - apt-get update && apt-get install -y
        libcurl4-openssl-dev
        libssl-dev
        libxml2-dev
        libuv1-dev
        pandoc
        qpdf
    - mkdir -p $R_LIBS_USER
    - Rscript -e "install.packages(c('curl', 'remotes'), repos='https://cloud.r-project.org')"
    - Rscript -e "remotes::install_deps(dependencies = TRUE)"
    # Stale objects make make(1) skip compilation, silently producing an
    # uninstrumented build that reports zero errors.
    - rm -f src/*.o src/*.so

sanitize-ubsan:
  <<: *sanitizer-base
  script:
    - |
      cat > /tmp/Makevars.ubsan <<'EOF'
      CFLAGS = -g -O1 -fno-omit-frame-pointer -fsanitize=undefined -fno-sanitize=float-divide-by-zero
      LDFLAGS = -fsanitize=undefined
      EOF
    - R_MAKEVARS_USER=/tmp/Makevars.ubsan R CMD INSTALL --no-docs --no-byte-compile -l $R_LIBS_USER .
    - UBSAN_OPTIONS=print_stacktrace=1 Rscript -e "library(testthat); library(sondage); test_dir('tests/testthat', package='sondage', stop_on_failure=TRUE)" 2>&1 | tee san.log
    # Sanitizer diagnostics do not fail the test run; gate on them explicitly.
    - |
      if grep -qE "runtime error" san.log; then
        grep -nE "runtime error" san.log
        echo "UBSan diagnostics found"
        exit 1
      fi
      echo "No UBSan diagnostics."
  artifacts:
    when: always
    paths:
      - san.log

sanitize-asan:
  <<: *sanitizer-base
  script:
    - |
      cat > /tmp/Makevars.asan <<'EOF'
      CFLAGS = -g -O1 -fno-omit-frame-pointer -fsanitize=address
      LDFLAGS = -fsanitize=address
      EOF
    # ASan must be preloaded: the runtime has to initialize before libR, or
    # R CMD INSTALL fails at the load test with a bare "loading failed".
    - export ASANLIB=$(gcc -print-file-name=libasan.so)
    - LD_PRELOAD=$ASANLIB ASAN_OPTIONS=detect_leaks=0 R_MAKEVARS_USER=/tmp/Makevars.asan R CMD INSTALL --no-docs --no-byte-compile -l $R_LIBS_USER .
    - LD_PRELOAD=$ASANLIB ASAN_OPTIONS=detect_leaks=0 Rscript -e "library(testthat); library(sondage); test_dir('tests/testthat', package='sondage', stop_on_failure=TRUE)" 2>&1 | tee san.log
    - |
      if grep -qE "ERROR: AddressSanitizer" san.log; then
        grep -nE "ERROR: AddressSanitizer" san.log
        echo "ASan diagnostics found"
        exit 1
      fi
      echo "No ASan diagnostics."
  artifacts:
    when: always
    paths:
      - san.log

coverage:
  stage: coverage
  image: rocker/r-ver:4.6.0
  before_script:
    - apt-get update && apt-get install -y
        libcurl4-openssl-dev
        libssl-dev
        libxml2-dev
        libuv1-dev
        pandoc
        qpdf
        git
    - mkdir -p $R_LIBS_USER
    - Rscript -e "install.packages(c('curl', 'remotes', 'covr', 'xml2'), repos='https://cloud.r-project.org')"
    - Rscript -e "remotes::install_deps(dependencies = TRUE)"
  script:
    - Rscript -e "covr::codecov(quiet = FALSE, token = Sys.getenv('CODECOV_TOKEN'))"
  coverage: '/Coverage:\s*\d+\.\d+%/'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  stage: pkgdown
  image: rocker/r-ver:4.6.0
  before_script:
    - apt-get update && apt-get install -y
        pandoc
        qpdf
        libcurl4-openssl-dev
        libssl-dev
        libxml2-dev
        libfontconfig1-dev
        libharfbuzz-dev
        libfribidi-dev
        libfreetype6-dev
        libpng-dev
        libtiff5-dev
        libjpeg-dev
        libuv1-dev
        cmake
    - mkdir -p $R_LIBS_USER
    - Rscript -e "install.packages(c('curl', 'remotes', 'bslib', 'fs', 'rmarkdown', 'pkgdown'), repos='https://cloud.r-project.org')"
    - Rscript -e "remotes::install_deps(dependencies = TRUE)"
  script:
    - Rscript -e "pkgdown::build_site()"
    - mv docs public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
